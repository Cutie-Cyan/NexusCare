name: Backend checks

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Resolve and install dependencies
        run: |
          uv lock
          uv sync --dev
      - name: Run backend tests
        run: uv run pytest
      - name: Validate migration can render SQL
        run: uv run alembic upgrade --sql head
