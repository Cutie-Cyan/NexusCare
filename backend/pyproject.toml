[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nexuscare-backend"
version = "0.1.0"
description = "FastAPI backend for the NexusCare hospital information and resource management system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.15,<2",
    "cryptography>=44,<46",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.8,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "supabase>=2.15,<3",
    "uvicorn[standard]>=0.34,<1",
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["app"]
